<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Feast Drop</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Color Feast Drop <small>prototype v0.4</small></h1><div class="layout"><div class="boardWrap"><canvas id="game" width="320" height="640"></canvas></div><aside><div class="food"><span>FEAST COLOR</span><b id="foodName">PURPLE</b><strong id="count">15.0</strong><small>秒後に紫を全消去</small></div><div class="stats">Score <b id="score">0</b><br>Chain <b id="chain">0</b></div><h2>NEXT</h2><canvas id="next" width="160" height="180"></canvas><button id="restart">RESTART</button><p>通常色は上下左右に<strong>3個以上</strong>つながると消えます。<br><strong>捕食予定色だけは何個つながっても消えません。</strong><br>タイマーが0になると紫が盤面から全消去され、その瞬間だけ各セルに重力が働いて崩落・連鎖します。通常の着地では4マスの形を維持します。紫は各ピースに最低1マス含まれます。</p></aside></div>
<div class="controls"><div class="dpad"><button data-a="left">◀</button><button data-a="down">▼</button><button data-a="right">▶</button></div><div class="rot"><button data-a="rotL">↺<span>左回転</span></button><button data-a="rotR">↻<span>右回転</span></button></div></div><button class="drop" data-a="drop">HARD DROP</button>
</main><script src="game.js"></script></body></html>
