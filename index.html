<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Color Enclose Drop</title><link rel='stylesheet' href='style.css'></head><body><main><section><h1>Color Enclose Drop <small>v0.7</small></h1><div class='game'><canvas id='game' width='320' height='640'></canvas><aside><div>Score <b id='score'>0</b></div><div>Enclosures <b id='enclosures'>0</b></div><h2>NEXT</h2><canvas id='next' width='150' height='210'></canvas><button id='restart'>RESTART</button><p class='help'>← → 移動 / ↓ 落下 / Z 左回転 / X・↑ 右回転 / Space ハードドロップ<br>同じ色で別の色を囲むと、囲んだ側だけが消えます。左右の壁と床も囲みの一辺として使えます。同色の塊が同じ壁に2点以上触れると、その間の壁がその色になって囲み判定に参加します。天井は使えません。</p></aside></div><div class='controls'><div class='dpad'><button data-a='left' class='left'>◀</button><button data-a='right' class='right'>▶</button><button data-a='down' class='down'>▼</button></div><div class='right-controls'><button data-a='drop' class='drop'>DROP</button><div class='rotations'><button data-a='rotL'>↺<span>左回転</span></button><button data-a='rotR'>↻<span>右回転</span></button></div></div></div></section></main><script src='game.js'></script></body></html>
