<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Color Bridge Drop</title><link rel='stylesheet' href='style.css'></head><body><main><section><h1>Color Bridge Drop <small>v0.3</small></h1><div class='game'><canvas id='game' width='320' height='640'></canvas><aside><div>Score <b id='score'>0</b></div><div>Bridges <b id='bridges'>0</b></div><h2>NEXT</h2><canvas id='next' width='150' height='210'></canvas><button id='restart'>RESTART</button><p class='help'>← → 移動 / ↓ 落下 / Z 左回転 / X・↑ 右回転 / Space ハードドロップ<br>左右の壁に触れた色は壁際に色マーカーが出ます。</p></aside></div><div class='controls'><div class='dpad'><button class='blank'></button><button data-a='down'>▼</button><button class='blank'></button><button data-a='left'>◀</button><button data-a='drop' class='drop'>DROP</button><button data-a='right'>▶</button></div><div class='rotations'><button data-a='rotL'>↺<span>左回転</span></button><button data-a='rotR'>↻<span>右回転</span></button></div></div></section></main><script src='game.js'></script></body></html>
